[package]
name = "ultidesk-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ultidesk-core = { workspace = true }
# For the shared `AudioDevice` shape the routing model and the settings IPC speak. The
# mapping from this platform's own DTO belongs beside the DTO, not in every caller.
ultidesk-topology = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Win32 bindings are only pulled in when actually targeting Windows, so the workspace
# still `cargo check`s on Linux CI (the code paths there return `Unsupported`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }
