[package]
name = "ultidesk-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ultidesk-agent"
path = "src/main.rs"

[dependencies]
ultidesk-core = { workspace = true }
ultidesk-topology = { workspace = true }
ultidesk-platform-windows = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

# The Wayland/portal backend only exists on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
ultidesk-platform-linux = { workspace = true }
